<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#15141f" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Corner Cutters Rally</title>
    <!-- the game's icon, the gravel hairpin (drawn by tools/android-art.py) -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="curtain" class="down"></div>
    <div id="app">
      <div id="screen"></div>
      <div id="deck">
        <div class="strip">
          <div><span data-hud="position"></span><span class="lap" data-hud="lap"></span></div>
        </div>
        <div class="controls">
          <div class="face">
            <div class="col low idle">
              <button class="b" data-button="b" aria-label="b"><span class="icon" data-hud="icon-b"></span></button>
              <span class="label" data-hud="label-b"></span>
            </div>
            <div class="col idle">
              <button class="a" data-button="a" aria-label="a"><span class="icon" data-hud="icon-a"></span></button>
              <span class="label" data-hud="label-a"></span>
            </div>
          </div>
        </div>
        <!-- the camera: the next view (race.ts binds it; on a stage, while you drive) -->
        <button class="view-btn" data-view aria-label="View"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="13.2" r="3.4" fill="none" stroke="currentColor" stroke-width="2.2"/></svg></button>
        <div class="sys">
          <button class="idle" data-button="select" aria-label="select"><span class="icon" data-hud="icon-select"></span><span data-hud="label-select"></span></button>
          <button class="idle" data-button="start" aria-label="start"><span class="icon" data-hud="icon-start"></span><span data-hud="label-start"></span></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
