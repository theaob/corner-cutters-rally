# Builds the Android app (the web build in a Capacitor WebView) as an APK,
# kept as a download on the run (Artifacts), and uploads it to the itch.io
# page's "android" channel (with the same BUTLER_API_KEY / ITCH_TARGET as the
# web build), where phones can download it.
#
# Runs on a push to the default branch and by hand from the Actions tab (and on a pull request only when the
# Android project itself changes; tests, types and the web build for every pull request are ci.yml's); only a push
# to the default branch (or a run by hand on it) uploads to itch.io.
#
# It also builds the Google Play version as an AAB, kept as a download
# on the run for uploading to the Play Console, and, with the PLAY_SERVICE_ACCOUNT_JSON secret set, uploaded to
# Play's internal testing track as a draft (store/README.md has the steps).
#
# Signing: with the four ANDROID_* secrets set (see the README), the APK and the
# AAB are signed with your release key, so each build installs as an update over
# the last. Without them, with the runner's throwaway debug key (and a warning):
# such a build installs fresh, but not over one signed with another key.
name: android

on:
  push:
    branches: [ccr-165b0d28-rj1xu0]
  pull_request:
    paths: ['android/**', 'capacitor.config.ts', 'package.json', 'package-lock.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # Secrets sit only on the step that uses them, so `npm ci` and the build tools can't read them; the job
      # keeps just whether each one is set (true or false), for the `if:` lines below.
      HAS_BUTLER_KEY: ${{ secrets.BUTLER_API_KEY != '' }}
      HAS_ITCH_TARGET: ${{ (vars.ITCH_TARGET || secrets.ITCH_TARGET) != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      # a Play Developer API service account's JSON key (store/README.md): with it, each Play build from the default
      # branch goes to Play's internal testing track as a draft release
      HAS_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
      # the play stats (Supabase, supabase/README.md): the project's URL and its
      # public (anon) key, as repository variables or secrets; left out, the game plays offline (no stats)
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci --ignore-scripts
      - name: Build the web game and copy it into the Android project
        run: npm run android:sync

      - name: Release key (when the secrets are set)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version="$(node -p "require('../package.json').version")"
          # every run gets a higher version code, so each APK installs as an update over the last
          ./gradlew --no-daemon assembleRelease -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="$version+${GITHUB_SHA::7}"
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/corner-cutters-rally-$version-$GITHUB_RUN_NUMBER.apk"
          if [ -n "${ANDROID_KEYSTORE_FILE:-}" ]; then echo "signed with: release key"
          else echo "::warning title=Android signing::No release key (the ANDROID_* secrets): signed with this runner's throwaway debug key, so it won't install as an update over an earlier build. See the README's Signing."; fi

      # a download on the run; kept a week, and not fatal: the account's artifact storage can be full
      # (it's shared by every repo), and the itch.io upload below is the real way out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: corner-cutters-rally-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 7

      # the Google Play build: the same app, built with VITE_STORE=play, as an AAB, Play's upload format; a download on
      # the run, uploaded to the Play Console by hand (after the itch.io upload below, which keeps the APK)
      - name: Build the Google Play AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          (cd .. && VITE_STORE=play npm run build && npx cap sync android)
          version="$(node -p "require('../package.json').version")"
          ./gradlew --no-daemon bundleRelease -PversionCode="$GITHUB_RUN_NUMBER" -PversionName="$version+${GITHUB_SHA::7}"
          mkdir -p ../play
          cp app/build/outputs/bundle/release/app-release.aab "../play/corner-cutters-rally-play-$version-$GITHUB_RUN_NUMBER.aab"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: corner-cutters-rally-play-aab
          path: play/*.aab
          if-no-files-found: error
          retention-days: 7

      # the source maps of what was just built (same code, same file names: a crash stack from the play stats dashboard
      # is turned back into the source's lines with `node tools/unminify.mjs`, tools/unminify.mjs says how); a download on
      # the run, kept three months, and not fatal; they never go into the app or the upload
      - name: Source maps of this version
        run: |
          VITE_SOURCEMAPS=1 npx vite build --outDir maps/web
          VITE_STORE=play VITE_SOURCEMAPS=1 npx vite build --outDir maps/play
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: corner-cutters-rally-sourcemaps
          path: maps/web/assets/*.map
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        continue-on-error: true
        with:
          name: corner-cutters-rally-sourcemaps-play
          path: maps/play/assets/*.map
          if-no-files-found: error
          retention-days: 90

      # to Google Play's internal testing track, as a draft (promoting it, and every track past internal, stays by hand
      # in the Play Console); only with the service account's key and the release key (Play takes no debug-signed build),
      # and not fatal: a run whose version code Play has seen, or a Console not set up yet, keeps the itch.io upload
      - name: Upload to Google Play (internal testing, draft)
        if: env.PUBLISH == 'true' && env.HAS_PLAY_KEY == 'true' && env.HAS_KEYSTORE == 'true'
        continue-on-error: true
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.theaob.cornercuttersrally
          releaseFiles: play/*.aab
          track: internal
          status: draft

      - name: Push to itch.io (android channel)
        if: env.PUBLISH == 'true' && env.HAS_BUTLER_KEY == 'true' && env.HAS_ITCH_TARGET == 'true'
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_TARGET: ${{ vars.ITCH_TARGET || secrets.ITCH_TARGET }}
        run: |
          # (butler is itch.io's own uploader and has no checksum to pin; its version is in the log, to pin to)
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          butler/butler -V
          version="$(node -p "require('./package.json').version")+${GITHUB_SHA::7}"
          # itch.io refuses a push while the channel's previous build is still processing (merges landing close
          # together); wait and retry instead of failing the run
          for attempt in 1 2 3 4 5 6; do
            butler/butler push out/*.apk "$ITCH_TARGET:android" --userversion "$version" && exit 0
            [ "$attempt" -lt 6 ] || break
            echo "::warning::butler push failed (attempt $attempt of 6); retrying in 60s"
            sleep 60
          done
          exit 1
