# Tests and builds the game on every push and pull request, and publishes the
# build to itch.io (as its HTML5 upload) on a push to the default branch, or
# when run by hand from the Actions tab.
#
# Setup (once):
#   - Repo secret   BUTLER_API_KEY : itch.io → Settings → API keys
#   - Repo variable ITCH_TARGET    : "<itch-user>/<game-slug>", e.g. "theaob/corner-cutters"
# Until both exist the publish step is skipped (with a warning saying which
# one is missing); tests and the build still run.
name: itch.io

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: itch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      # Accept ITCH_TARGET as a repository variable or, failing that, a secret.
      ITCH_TARGET: ${{ vars.ITCH_TARGET || secrets.ITCH_TARGET }}
      # publish from the default branch (push or manual run), never from pull requests
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
      # the Daily Challenge's online board and the play stats (Supabase, supabase/README.md): the project's URL and its
      # public (anon) key, as repository variables or secrets; left out, the game plays offline (no board, no stats)
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Check itch.io settings
        if: env.PUBLISH == 'true'
        run: |
          [ -n "$BUTLER_API_KEY" ] && echo "BUTLER_API_KEY: set" || echo "::warning::BUTLER_API_KEY is missing: add it under Settings → Secrets and variables → Actions → Secrets"
          [ -n "$ITCH_TARGET" ] && echo "ITCH_TARGET: set ($ITCH_TARGET)" || echo "::warning::ITCH_TARGET is missing: add it under Settings → Secrets and variables → Actions → Variables (e.g. theaob/corner-cutters)"

      - name: Push to itch.io
        if: env.PUBLISH == 'true' && env.BUTLER_API_KEY != '' && env.ITCH_TARGET != ''
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          butler/butler -V
          version="$(node -p "require('./package.json').version")+${GITHUB_SHA::7}"
          butler/butler push dist "$ITCH_TARGET:html5" --userversion "$version"
