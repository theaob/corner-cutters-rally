# GitHub Pages: the play-stats dashboard (stats.html, src/stats/) at the site's root. Built on a push to the default
# branch that changes it, or by hand (Actions → pages → Run workflow).
#
# The dashboard's built with the Supabase project's URL and public key (the repository variables SUPABASE_URL and
# SUPABASE_ANON_KEY, as the game's builds use) and reads the totals live in the browser.
#
# Once, first: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths:
      - stats.html
      - src/stats/**
      - src/f1/stages.ts
      - vite.stats.config.ts
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the Supabase settings
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ] && echo "Supabase: set" || echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY is missing: the dashboard will say it isn't set up"
      - run: npm run stats:build
      # (the dashboard at the site's root)
      - run: mv dist-stats/stats.html dist-stats/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-stats
      - id: deployment
        uses: actions/deploy-pages@v4
