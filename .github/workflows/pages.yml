# GitHub Pages: the play-stats dashboard (stats.html, src/stats/) at the site's root, with the privacy policy and the
# terms beside it (legal/: privacy.html, terms.html; the game's settings and the store listings link to them). Built on
# a push to the default branch that changes them, or by hand (Actions → pages → Run workflow).
#
# The dashboard's built with the Supabase project's URL and public key (the repository variables SUPABASE_URL and
# SUPABASE_ANON_KEY, as the game's builds use) and reads the totals live in the browser.
#
# Once, first: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: pages

on:
  push:
    branches: [ccr-165b0d28-rj1xu0]
    paths:
      - stats.html
      - legal/**
      - src/stats/**
      - src/f1/stages.ts
      - vite.stats.config.ts
      - package-lock.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check the Supabase settings
        run: |
          [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ] && echo "Supabase: set" || echo "::warning::SUPABASE_URL or SUPABASE_ANON_KEY is missing: the dashboard will say it isn't set up"
      - run: npm run stats:build
      # (the dashboard at the site's root)
      - run: mv dist-stats/stats.html dist-stats/index.html
      # (the privacy policy and the terms, with the game's icon for their tabs)
      - run: cp legal/* dist-stats/ && cp public/favicon.png dist-stats/
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-stats
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
